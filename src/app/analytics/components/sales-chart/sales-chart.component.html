<mat-card>
  <mat-card-content>
    <div class="chart-container">
      <canvas baseChart
        [type]="chartConfiguration.type"
        [data]="chartConfiguration.data"
        [options]="chartConfiguration.options">
      </canvas>
    </div>
    
    <div *ngIf="!chartData" class="no-data">
      <p>No data available for the selected filters</p>
    </div>
  </mat-card-content>
</mat-card>
