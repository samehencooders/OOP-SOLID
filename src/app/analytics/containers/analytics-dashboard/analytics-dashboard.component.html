<div class="analytics-dashboard">
  <div class="dashboard-header">
    <h1>Analytics Dashboard</h1>
    <div class="actions">
      <button mat-raised-button color="primary" (click)="refreshData()">
        <mat-icon>refresh</mat-icon>
        Refresh Data
      </button>
    </div>
  </div>

  <div *ngIf="loading" class="loading-container">
    <mat-spinner diameter="40"></mat-spinner>
    <p>Loading analytics data...</p>
  </div>

  <ng-container *ngIf="!loading">
    <!-- Performance Metrics -->
    <app-performance-metrics 
      [metrics]="performanceMetrics$ | async"
      class="dashboard-section">
    </app-performance-metrics>

    <!-- Filter Panel -->
    <app-filter-panel
      [filterForm]="filterForm"
      [categories]="categories"
      [regions]="regions"
      [statuses]="statuses"
      [dateRange]="dateRange"
      [amountRange]="amountRange"
      (resetFilters)="resetFilters()"
      class="dashboard-section">
    </app-filter-panel>

    <!-- Analytics Summary -->
    <div *ngIf="analyticsSummary$ | async as summary" class="dashboard-section summary-cards">
      <app-metric-card
        title="Total Sales"
        [value]="summary.totalSales | currency"
        icon="attach_money">
      </app-metric-card>
      
      <app-metric-card
        title="Average Sale"
        [value]="summary.averageSale | currency"
        icon="trending_up">
      </app-metric-card>
      
      <app-metric-card
        title="Sales Count"
        [value]="summary.salesCount"
        icon="shopping_cart">
      </app-metric-card>
      
      <app-metric-card
        title="Top Product"
        [value]="summary.topProduct"
        icon="star">
      </app-metric-card>
    </div>

    <!-- Charts Section -->
    <mat-tab-group class="dashboard-section">
      <mat-tab label="Sales Over Time">
        <app-sales-chart
          [chartData]="timeSeriesChartData$ | async"
          chartType="line">
        </app-sales-chart>
      </mat-tab>
      
      <mat-tab label="Sales by Category">
        <app-sales-chart
          [chartData]="categoryChartData$ | async"
          chartType="bar">
        </app-sales-chart>
      </mat-tab>
      
      <mat-tab label="Sales by Region">
        <app-sales-chart
          [chartData]="regionChartData$ | async"
          chartType="doughnut">
        </app-sales-chart>
      </mat-tab>
    </mat-tab-group>

    <!-- Data Table -->
    <app-data-table
      [salesData]="filteredSalesData$ | async"
      class="dashboard-section">
    </app-data-table>
  </ng-container>
</div>
