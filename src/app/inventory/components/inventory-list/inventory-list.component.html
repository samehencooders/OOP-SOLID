<!-- inventory-list.component.html -->
<div class="inventory-list-container">
    <div class="list-header">
      <h1>Inventory List</h1>
      <div class="header-actions">
        <form [formGroup]="searchForm" (ngSubmit)="applyFilter()">
          <mat-form-field appearance="outline" class="search-field">
            <mat-label>Search</mat-label>
            <input matInput type="text" formControlName="searchTerm" placeholder="Search by name, SKU, or category">
            <mat-icon matPrefix>search</mat-icon>
            <button *ngIf="searchForm.get('searchTerm')?.value" matSuffix mat-icon-button aria-label="Clear" (click)="clearSearch()">
              <mat-icon>close</mat-icon>
            </button>
          </mat-form-field>
        </form>
        
        <button mat-raised-button color="primary" class="add-button" (click)="openAddItemDialog()">
          <mat-icon>add</mat-icon> Add Item
        </button>
      </div>
    </div>
  
    <mat-card class="list-card">
        <div class="filters">
            <mat-chip-list aria-label="Inventory filters">
              <mat-chip [selected]="filterTypeControl.value === 'all'" (click)="filterTypeControl.setValue('all')">All Items</mat-chip>
              <mat-chip color="warn" [selected]="filterTypeControl.value === 'lowStock'" (click)="filterTypeControl.setValue('lowStock')">Low Stock</mat-chip>
              <mat-chip color="accent" [selected]="filterTypeControl.value === 'toReorder'" (click)="filterTypeControl.setValue('toReorder')">To Reorder</mat-chip>
              <mat-chip color="warn" [selected]="filterTypeControl.value === 'outOfStock'" (click)="filterTypeControl.setValue('outOfStock')">Out of Stock</mat-chip>
            </mat-chip-list>
          </div>
  
      <div class="spinner-container" *ngIf="isLoading">
        <mat-spinner diameter="40"></mat-spinner>
      </div>
  
      <table mat-table [dataSource]="dataSource" matSort class="inventory-table" [hidden]="isLoading">
        <!-- Image Column -->
        <ng-container matColumnDef="image">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let item">
            <div class="item-image" [style.backgroundImage]="'url(' + (item.imageUrl || 'assets/placeholder.png') + ')'"></div>
          </td>
        </ng-container>
  
        <!-- Name Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
          <td mat-cell *matCellDef="let item">
            <div class="item-name">
              <span>{{item.name}}</span>
              <span class="sku">SKU: {{item.sku}}</span>
            </div>
          </td>
        </ng-container>
  
        <!-- Category Column -->
        <ng-container matColumnDef="category">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Category</th>
          <td mat-cell *matCellDef="let item">{{item.category}}</td>
        </ng-container>
  
        <!-- Stock Column -->
        <ng-container matColumnDef="currentStock">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Stock</th>
          <td mat-cell *matCellDef="let item">
            <div class="stock-badge" [ngClass]="{
              'low-stock': item.currentStock <= item.minimumStock,
              'out-of-stock': item.currentStock === 0,
              'good-stock': item.currentStock > item.minimumStock
            }">
              {{item.currentStock}}
            </div>
          </td>
        </ng-container>
  
        <!-- Price Column -->
        <ng-container matColumnDef="price">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Price</th>
          <td mat-cell *matCellDef="let item">{{item.price | currency}}</td>
        </ng-container>
  
        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let item">
            <div class="action-buttons">
              <button mat-icon-button color="primary" [routerLink]="['/inventory/detail', item.id]">
                <mat-icon>visibility</mat-icon>
              </button>
              <button mat-icon-button color="accent" (click)="openEditItemDialog(item)">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="confirmDelete(item)">
                <mat-icon>delete</mat-icon>
              </button>
              <button mat-icon-button [matMenuTriggerFor]="menu">
                <mat-icon>more_vert</mat-icon>
              </button>
              <mat-menu #menu="matMenu">
                <button mat-menu-item (click)="openAddStockDialog(item)">
                  <mat-icon>add_shopping_cart</mat-icon>
                  <span>Add Stock</span>
                </button>
                <button mat-menu-item (click)="openRemoveStockDialog(item)">
                  <mat-icon>remove_shopping_cart</mat-icon>
                  <span>Remove Stock</span>
                </button>
                <button mat-menu-item [routerLink]="['/inventory/detail', item.id]" [queryParams]="{tab: 'movements'}">
                  <mat-icon>history</mat-icon>
                  <span>View History</span>
                </button>
              </mat-menu>
            </div>
          </td>
        </ng-container>
  
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  
        <!-- Row shown when there is no matching data -->
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell no-data" [attr.colspan]="displayedColumns.length">
            No inventory items found matching your search or filter
          </td>
        </tr>
      </table>
  
      <mat-paginator [pageSizeOptions]="[10, 25, 50, 100]" showFirstLastButtons></mat-paginator>
    </mat-card>
  </div>
