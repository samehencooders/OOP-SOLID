<!-- inventory-list.component.html -->
<div class="inventory-list-container">
    <div class="list-header">
      <h2>Inventory Items</h2>
      <div class="actions">
        <form [formGroup]="searchForm" class="search-form">
            <mat-form-field appearance="outline">
              <mat-label>Search suppliers</mat-label>
              <input matInput formControlName="searchQuery" placeholder="Search by name, email, etc...">
              <mat-icon matSuffix>search</mat-icon>
            </mat-form-field>
          </form>
        <button mat-raised-button color="primary" (click)="openAddDialog()">
          <mat-icon>add</mat-icon> Add Item
        </button>
      </div>
    </div>
  
    <div class="table-container">
      <mat-progress-bar *ngIf="isLoading" mode="indeterminate"></mat-progress-bar>
      
      <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z8">
        <!-- SKU Column -->
        <ng-container matColumnDef="sku">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>SKU</th>
          <td mat-cell *matCellDef="let item">{{item.sku}}</td>
        </ng-container>
  
        <!-- Name Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
          <td mat-cell *matCellDef="let item">{{item.name}}</td>
        </ng-container>
  
        <!-- Category Column -->
        <ng-container matColumnDef="category">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Category</th>
          <td mat-cell *matCellDef="let item">{{item.category.name}}</td>
        </ng-container>
  
        <!-- Current Stock Column -->
        <ng-container matColumnDef="currentStock">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Stock</th>
          <td mat-cell *matCellDef="let item">
            <span [class.low-stock]="item.isLowOnStock()" [class.out-of-stock]="item.currentStock === 0">
              {{item.currentStock}}
            </span>
          </td>
        </ng-container>
  
        <!-- Price Column -->
        <ng-container matColumnDef="price">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Price</th>
          <td mat-cell *matCellDef="let item">{{item.price | currency}}</td>
        </ng-container>
  
        <!-- Total Value Column -->
        <ng-container matColumnDef="totalValue">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Total Value</th>
          <td mat-cell *matCellDef="let item">{{item.getTotalValue() | currency}}</td>
        </ng-container>
  
        <!-- Status Column -->
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
          <td mat-cell *matCellDef="let item">
            <mat-icon [color]="getStatusColor(item)">{{getStatusIcon(item)}}</mat-icon>
          </td>
        </ng-container>
  
        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let item">
            <button mat-icon-button [matMenuTriggerFor]="menu">
              <mat-icon>more_vert</mat-icon>
            </button>
            <mat-menu #menu="matMenu">
              <button mat-menu-item (click)="openEditDialog(item)">
                <mat-icon>edit</mat-icon>
                <span>Edit</span>
              </button>
              <button mat-menu-item (click)="deleteItem(item)">
                <mat-icon>delete</mat-icon>
                <span>Delete</span>
              </button>
            </mat-menu>
          </td>
        </ng-container>
  
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
  
      <mat-paginator [pageSizeOptions]="[10, 25, 50]" showFirstLastButtons></mat-paginator>
    </div>
  </div>
