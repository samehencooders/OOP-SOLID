<div class="dashboard-container">
  <h1>Dashboard</h1>
  <div class="widgets-container">
    <mat-card class="widget">
      <mat-card-header>
        <mat-card-title>Key Metrics</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <mat-list>
          <mat-list-item>
            <mat-icon mat-list-icon>assignment</mat-icon>
            <div mat-line>Total Tasks</div>
            <div mat-line>{{ (tasks$ | async)?.length }}</div>
          </mat-list-item>
          <mat-list-item>
            <mat-icon mat-list-icon>inventory</mat-icon>
            <div mat-line>Total Inventory Value</div>
            <div mat-line>{{ totalInventoryValue$ | async | currency }}</div>
          </mat-list-item>
        </mat-list>
      </mat-card-content>
    </mat-card>

    <mat-card class="widget">
      <mat-card-header>
        <mat-card-title>Quick Actions</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <button mat-raised-button color="primary" routerLink="/task-board/board">View Task Board</button>
        <button mat-raised-button color="accent" routerLink="/inventory">Manage Inventory</button>
      </mat-card-content>
    </mat-card>
  </div>
</div>
